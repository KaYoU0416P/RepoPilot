services:
  postgres:
    # 用 pgvector 镜像（PG 17 + pgvector 扩展）。你本机已有，不用再拉。
    # 现在用不到向量，但以后做代码语义检索时不用换镜像。
    image: pgvector/pgvector:0.8.6-pg17-trixie
    container_name: repopilot-pg
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot
      POSTGRES_DB: repopilot
    ports:
      - "5433:5432"        # 5433 避免和你本机可能已有的 PG 撞端口
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
